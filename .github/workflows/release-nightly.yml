name: goreleaser

on:
  push:
    branches: [ main, devel ]

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: import gpg
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPGSIGN_KEY }}
          passphrase: ${{ secrets.GPGSIGN_PASSPHRASE }}
      - name: Set Tag
        run: |
          echo "goreleaser_current_tag=$(git describe --match 'v*' --tags)" >> $GITHUB_ENV
      - name: get SDK version
        id: sdk_version
        run: echo "version=$(go list -f '{{.Version}}' -m code.gitea.io/sdk/gitea)" >> "$GITHUB_OUTPUT"
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
            distribution: goreleaser
            version: '~> v2'
            args: release --clean --skip=validate
        env:
          GORELEASER_CURRENT_TAG: ${{ env.goreleaser_current_tag }}
          SDK_VERSION: ${{ steps.sdk_version.outputs.version }}
          GPGSIGN_PASSPHRASE: ${{ secrets.GPGSIGN_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # GitHub sets this automatically
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release-image:
    runs-on: ubuntu-latest
    env:
      DOCKER_ORG: gitea
      DOCKER_LATEST: nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # all history for all branches and tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Tag
        run: |
          echo "goreleaser_current_tag=$(git describe --match 'v*' --tags)" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          ACTIONS_RUNTIME_TOKEN: '' # See https://gitea.com/gitea/act_runner/issues/119
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/tea:latest
            ghcr.io/${{ github.repository }}/tea:${{ env.goreleaser_current_tag }}

      - name: Build and push gitea action runner image
        uses: docker/build-push-action@v6
        env:
          ACTIONS_RUNTIME_TOKEN: '' # See https://gitea.com/gitea/act_runner/issues/119
        with:
          context: .
          file: ./Dockerfile
          target: runner-image
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/tea-runner-image:latest
            ghcr.io/${{ github.repository }}/tea-runner-image:${{ env.goreleaser_current_tag }}
